{% extends "base.html" %} {% block content %}
<div class="page-section">
  <div class="card-section max-w-md mx-auto">
    <div class="text-center">
      <div
        class="mx-auto h-12 w-12 bg-gray-900 rounded-full flex items-center justify-center"
      >
        <i class="fas fa-lock text-white"></i>
      </div>
      <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
        Church Cell Tracker
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        Sign in with your username and password
      </p>
    </div>
    <form class="mt-8 space-y-6" method="POST">
      <div class="rounded-md shadow-sm -space-y-px">
        <div>
          <label for="username" class="sr-only">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm input-field"
            placeholder="Username"
          />
        </div>
        <div class="mt-3">
          <label for="password" class="sr-only">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm input-field"
            placeholder="Password"
          />
        </div>
      </div>

      {% if error %}
      <div class="rounded-md bg-red-50 p-4">
        <div class="flex">
          <div class="flex-shrink-0">
            <i class="fas fa-exclamation-circle text-red-400"></i>
          </div>
          <div class="ml-3">
            <h3 class="text-sm font-medium text-red-800">
              Authentication Error
            </h3>
            <div class="mt-2 text-sm text-red-700">
              <p>{{ error }}</p>
            </div>
          </div>
        </div>
      </div>
      {% endif %}

      <div>
        <button type="submit" class="group relative w-full btn-solid">
          <span class="absolute left-0 inset-y-0 flex items-center pl-3">
            <i
              class="fas fa-unlock text-blue-500 group-hover:text-blue-400"
            ></i>
          </span>
          Sign in
        </button>
      </div>

      <div class="text-center">
        <a
          href="{{ url_for('home') }}"
          class="font-medium text-gray-700 hover:text-gray-900"
        >Back to Home</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
